<div class="executor-group" data-index="{{ index }}">
    <div class="executor-group-header">
        <h4><span class="exec-num">#{{ index }}</span> Executor</h4>
        <button type="button" class="remove-btn" onclick="this.closest('.executor-group').remove()" title="Remove">&times;</button>
    </div>
    <div class="form-row">
        <div class="field">
            <label>Image <small>(required)</small></label>
            <input type="text" name="executor_{{ index }}_image" placeholder="alpine:latest" required>
        </div>
        <div class="field">
            <label>Workdir</label>
            <input type="text" name="executor_{{ index }}_workdir" placeholder="/workspace">
        </div>
    </div>
    <div class="field full">
        <label>Command <small>(space-separated)</small></label>
        <input type="text" name="executor_{{ index }}_command" placeholder="echo hello world" required>
    </div>
    <details class="collapsible" style="margin-top:6px;">
        <summary>Advanced</summary>
        <div class="collapsible-body">
            <div class="form-row">
                <div class="field">
                    <label>Stdin</label>
                    <input type="text" name="executor_{{ index }}_stdin" placeholder="/data/input.txt">
                </div>
                <div class="field">
                    <label>Stdout</label>
                    <input type="text" name="executor_{{ index }}_stdout" placeholder="/data/stdout.log">
                </div>
            </div>
            <div class="field">
                <label>Stderr</label>
                <input type="text" name="executor_{{ index }}_stderr" placeholder="/data/stderr.log">
            </div>
            <div class="field">
                <label>Env <small>(KEY=VALUE per line)</small></label>
                <textarea name="executor_{{ index }}_env" rows="2" placeholder="FOO=bar"></textarea>
            </div>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--fg-dim);margin-top:3px;">
                <input type="checkbox" name="executor_{{ index }}_ignore_error" value="true" style="width:auto;margin:0;">
                Ignore errors
            </label>
        </div>
    </details>
</div>
