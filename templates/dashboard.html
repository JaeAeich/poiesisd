{% extends "base.html" %}

{% block title %}poiesisD{% endblock %}

{% block tabs %}{% endblock %}

{% block content %}
<div class="welcome">
    <h2>poiesisD</h2>
    <div class="shortcuts">
        <div class="shortcut-row">
            <span class="keys"><span class="kbd">/</span></span>
            <span class="desc">Search tasks</span>
        </div>
        <div class="shortcut-row">
            <span class="keys"><span class="kbd">Alt</span>+<span class="kbd">N</span></span>
            <span class="desc">New Task</span>
        </div>
        <div class="shortcut-row">
            <span class="keys"><span class="kbd">Ctrl</span>+<span class="kbd">J</span></span>
            <span class="desc">Toggle Output</span>
        </div>
        <div class="shortcut-row">
            <span class="keys"><span class="kbd">Ctrl</span>+<span class="kbd">B</span></span>
            <span class="desc">Toggle Sidebar</span>
        </div>
        <div class="shortcut-row">
            <span class="keys"><span class="kbd">Ctrl</span>+<span class="kbd">K</span></span>
            <span class="desc">Command Palette</span>
        </div>
        <div class="shortcut-row">
            <span class="keys"><span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">L</span></span>
            <span class="desc">Toggle Theme</span>
        </div>
    </div>
    <div class="credit">built by <a href="https://github.com/jaeaeich" target="_blank" rel="noopener">jaeaeich</a> (Javed Habib)</div>
</div>
{% endblock %}
